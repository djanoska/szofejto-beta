<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Szófejtő</title>

  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="stilus.css?v=15">
</head>

<body>

  <header>
    <h1>SZÓFEJTŐ</h1>

<button id="info-button" aria-label="Információ">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <circle cx="12" cy="12" r="9"></circle>
    <line x1="12" y1="10.5" x2="12" y2="16"></line>
    <circle class="info-dot" cx="12" cy="7.2" r="0.8"></circle>
  </svg>
</button>

  </header>

  <div id="info-modal" class="modal">
  <div class="modal-content">

    <button id="close-info" class="modal-close" aria-label="Bezárás">
      ×
    </button>

    <h2>Szabályok</h2>

    <p>
      Találd ki a napi szót. Összesen 8 tipp áll rendelkezésre.
    </p>
    
<div class="example-word">
  <div class="cell correct">R</div>
  <div class="cell">É</div>
  <div class="cell present">T</div>
  <div class="cell absent">E</div>
  <div class="cell">S</div>
</div>
    
    <p>
      Az R betű szerepel a szóban és jó helyen van.<br>A T betű szerepel a szóban de a helye nem megfelelő.<br>Az S betű egyáltalán nem szerepel a szóban.
    </p>

    <p>
      A játék a szózat és a wordle mintájára készült.<br>V1.2
    </p>

  </div>
</div>

  <!-- Fejléc alatt -->

    <div id="game-container">

    <div id="msg"></div>

    <div id="grid"></div>


    <div id="keyboard">

      <!-- 1. SOR -->
      <div class="keyboard-row">
        <button class="key" data-key="cs">CS</button>
        <button class="key" data-key="dz">DZ</button>
        <button class="key" data-key="dzs">DZS</button>
        <button class="key" data-key="gy">GY</button>
        <button class="key" data-key="ly">LY</button>
        <button class="key" data-key="ny">NY</button>
        <button class="key" data-key="sz">SZ</button>
        <button class="key" data-key="ty">TY</button>
        <button class="key" data-key="zs">ZS</button>
        <button class="key" data-key="ö">Ö</button>
        <button class="key" data-key="ü">Ü</button>
        <button class="key" data-key="ó">Ó</button>
      </div>


      <!-- 2. SOR -->
      <div class="keyboard-row">
        <button class="key" data-key="q">Q</button>
        <button class="key" data-key="w">W</button>
        <button class="key" data-key="e">E</button>
        <button class="key" data-key="r">R</button>
        <button class="key" data-key="t">T</button>
        <button class="key" data-key="z">Z</button>
        <button class="key" data-key="u">U</button>
        <button class="key" data-key="i">I</button>
        <button class="key" data-key="o">O</button>
        <button class="key" data-key="p">P</button>
        <button class="key" data-key="ő">Ő</button>
        <button class="key" data-key="ú">Ú</button>
  </div>


      <!-- 3. SOR -->
      <div class="keyboard-row">
        <button class="key" data-key="a">A</button>
        <button class="key" data-key="s">S</button>
        <button class="key" data-key="d">D</button>
        <button class="key" data-key="f">F</button>
        <button class="key" data-key="g">G</button>
        <button class="key" data-key="h">H</button>
        <button class="key" data-key="j">J</button>
        <button class="key" data-key="k">K</button>
        <button class="key" data-key="l">L</button>
        <button class="key" data-key="é">É</button>
        <button class="key" data-key="á">Á</button>
        <button class="key" data-key="ű">Ű</button>
  </div>


      <!-- 4. SOR -->
      <div class="keyboard-row">
        <button class="key wide" data-key="back">DEL</button>

        <button class="key" data-key="í">Í</button>
        <button class="key" data-key="y">Y</button>
        <button class="key" data-key="x">X</button>
        <button class="key" data-key="c">C</button>
        <button class="key" data-key="v">V</button>
        <button class="key" data-key="b">B</button>
        <button class="key" data-key="n">N</button>
        <button class="key" data-key="m">M</button>

        <button class="key wide" data-key="enter">ENTER</button>
      </div>

  </div>

  <script src="szofejto.js?v=15"></script>

</body>
</html>
